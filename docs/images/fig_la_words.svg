<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360"><title>Logic analyser word formats</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a4a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6670"/></marker></defs><rect x="0.75" y="0.75" width="938.5" height="358.5" rx="12" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/>
<text x="20" y="48" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#1c2733">change mode: one word per change</text>
<rect x="20" y="60" width="450" height="46" rx="3" fill="#dbe8fb" stroke="#2a5db0" stroke-width="1.3"/>
<text x="245.0" y="80" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1c2733">channel values after the change</text>
<text x="245.0" y="94" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1c2733">bits 31 .. 16</text>
<rect x="470" y="60" width="450" height="46" rx="3" fill="#fde8d0" stroke="#c46a12" stroke-width="1.3"/>
<text x="695.0" y="80" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1c2733">clocks since the previous word</text>
<text x="695.0" y="94" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1c2733">bits 15 .. 0</text>
<text x="20" y="138" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#1c2733">overflow word (65 535 quiet clocks)</text>
<rect x="20" y="150" width="450" height="46" rx="3" fill="#dbe8fb" stroke="#2a5db0" stroke-width="1.3"/>
<text x="245.0" y="170" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1c2733">same values as before</text>
<text x="245.0" y="184" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1c2733">bits 31 .. 16</text>
<rect x="470" y="150" width="450" height="46" rx="3" fill="#eef0f3" stroke="#5c6670" stroke-width="1.3"/>
<text x="695.0" y="170" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1c2733">0xFFFF</text>
<text x="695.0" y="184" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1c2733">bits 15 .. 0</text>
<text x="20" y="228" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#1c2733">sample mode: four samples per word</text>
<rect x="20" y="240" width="225" height="46" rx="3" fill="#dff3e3" stroke="#2e7d46" stroke-width="1.3"/>
<text x="132.5" y="260" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1c2733">sample 3</text>
<text x="132.5" y="274" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1c2733">bits 31 .. 24</text>
<rect x="245" y="240" width="225" height="46" rx="3" fill="#dff3e3" stroke="#2e7d46" stroke-width="1.3"/>
<text x="357.5" y="260" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1c2733">sample 2</text>
<text x="357.5" y="274" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1c2733">bits 23 .. 16</text>
<rect x="470" y="240" width="225" height="46" rx="3" fill="#dff3e3" stroke="#2e7d46" stroke-width="1.3"/>
<text x="582.5" y="260" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1c2733">sample 1</text>
<text x="582.5" y="274" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1c2733">bits 15 .. 8</text>
<rect x="695" y="240" width="225" height="46" rx="3" fill="#dff3e3" stroke="#2e7d46" stroke-width="1.3"/>
<text x="807.5" y="260" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1c2733">sample 0</text>
<text x="807.5" y="274" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1c2733">bits 7 .. 0</text>
<text x="470" y="332" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">the first word after arming is the starting state (delta 0); a word whose values equal the previous ones is an overflow word, never a change</text>
</svg>
