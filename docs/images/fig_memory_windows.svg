<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470"><title>Shared instruction memory and windows</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a4a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6670"/></marker></defs><rect x="0.75" y="0.75" width="898.5" height="468.5" rx="12" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/>
<text x="450" y="28" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1c2733">512 words, shared by both engines (word numbers)</text>
<rect x="60" y="70" width="768.0" height="56" rx="3" fill="#eef0f3" stroke="#5c6670" stroke-width="1.5"/>
<rect x="60" y="70" width="300.0" height="56" rx="3" fill="#dbe8fb" stroke="#2a5db0" stroke-width="1.5"/>
<text x="210.0" y="103" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1c2733">engine 0 program</text>
<rect x="444.0" y="70" width="247.5" height="56" rx="3" fill="#dff3e3" stroke="#2e7d46" stroke-width="1.5"/>
<text x="567.0" y="103" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1c2733">engine 1 program</text>
<text x="750.0" y="103" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#5c6670">free</text>
<line x1="60.0" y1="126" x2="60.0" y2="140" stroke="#5c6670" stroke-width="1.2"/>
<text x="60.0" y="154" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">0</text>
<line x1="360.0" y1="126" x2="360.0" y2="140" stroke="#5c6670" stroke-width="1.2"/>
<text x="360.0" y="154" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">200</text>
<line x1="444.0" y1="126" x2="444.0" y2="140" stroke="#5c6670" stroke-width="1.2"/>
<text x="444.0" y="154" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">256</text>
<line x1="691.5" y1="126" x2="691.5" y2="140" stroke="#5c6670" stroke-width="1.2"/>
<text x="691.5" y="154" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">421</text>
<line x1="828.0" y1="126" x2="828.0" y2="140" stroke="#5c6670" stroke-width="1.2"/>
<text x="828.0" y="154" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">512</text>
<path d="M 60 180 L 60 196 L 360.0 196 L 360.0 180" stroke="#2a5db0" stroke-width="2" fill="none"/>
<text x="210.0" y="216" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#2a5db0">window of engine 0: [0, 200)</text>
<path d="M 444.0 180 L 444.0 196 L 691.5 196 L 691.5 180" stroke="#2e7d46" stroke-width="2" fill="none"/>
<text x="567.0" y="216" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#2e7d46">window of engine 1: [256, 421)</text>
<text x="66" y="176" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#2a5db0">START = 0</text>
<text x="450.0" y="176" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#2e7d46">START = 256</text>
<rect x="60" y="250" width="780" height="190" rx="8" fill="#fff3c4" stroke="#b38f00" stroke-width="1.5"/>
<text x="80" y="304" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1c2733">A program&#x27;s first instruction (OP_REGION) names the window it may fetch from; fetching outside faults the engine.</text>
<text x="80" y="325" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1c2733">The window is set once per run and cannot be widened until the engine is held.</text>
<text x="80" y="346" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1c2733">The host cannot write into the window of a running engine (result NOT_ALLOWED).</text>
<text x="80" y="367" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1c2733">Images that run together must not overlap; the host library checks this before it writes anything.</text>
<text x="80" y="276" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#1c2733">Rules the chip enforces</text>
</svg>
