<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560"><title>Raspberry Pi Pico wired to the chip</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a4a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6670"/></marker></defs><rect x="0.75" y="0.75" width="918.5" height="558.5" rx="12" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/>
<rect x="40" y="40" width="230" height="480" rx="10" fill="#dff3e3" stroke="#2e7d46" stroke-width="1.5"/>
<text x="155" y="68" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2733">Raspberry Pi Pico</text>
<rect x="650" y="40" width="230" height="480" rx="10" fill="#dbe8fb" stroke="#2a5db0" stroke-width="1.5"/>
<text x="765" y="68" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2733">Protocol emulator</text>
<text x="52" y="104" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1c2733">GP18  (pin 24)  SPI0 SCK</text>
<text x="868" y="104" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1c2733">ui_in[0]  SCLK</text>
<line x1="270" y1="100" x2="650" y2="100" stroke="#2b3a4a" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="460" y="94" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">management clock</text>
<text x="52" y="146" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1c2733">GP19  (pin 25)  SPI0 TX</text>
<text x="868" y="146" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1c2733">ui_in[1]  MOSI</text>
<line x1="270" y1="142" x2="650" y2="142" stroke="#2b3a4a" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="460" y="136" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">host to chip</text>
<text x="52" y="188" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1c2733">GP16  (pin 21)  SPI0 RX</text>
<text x="868" y="188" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1c2733">uo_out[0]  MISO</text>
<line x1="650" y1="184" x2="270" y2="184" stroke="#2b3a4a" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="460" y="178" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">chip to host</text>
<text x="52" y="230" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1c2733">GP17  (pin 22)  SPI0 CSn</text>
<text x="868" y="230" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1c2733">ui_in[2]  CS_N</text>
<line x1="270" y1="226" x2="650" y2="226" stroke="#2b3a4a" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="460" y="220" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">chip select</text>
<text x="52" y="272" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1c2733">GP21  (pin 27)  clock out</text>
<text x="868" y="272" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1c2733">clk</text>
<line x1="270" y1="268" x2="650" y2="268" stroke="#2b3a4a" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="460" y="262" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">system clock</text>
<text x="52" y="314" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1c2733">GP22  (pin 29)  GPIO</text>
<text x="868" y="314" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1c2733">rst_n</text>
<line x1="270" y1="310" x2="650" y2="310" stroke="#2b3a4a" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="460" y="304" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">reset, active low</text>
<text x="52" y="356" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1c2733">GP26  (pin 31)  GPIO</text>
<text x="868" y="356" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1c2733">ui_in[3]  HOLD</text>
<line x1="270" y1="352" x2="650" y2="352" stroke="#2b3a4a" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="460" y="346" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">optional emergency stop</text>
<text x="52" y="398" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1c2733">GP27  (pin 32)  GPIO in</text>
<text x="868" y="398" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1c2733">uo_out[1]  IRQ</text>
<line x1="650" y1="394" x2="270" y2="394" stroke="#2b3a4a" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="460" y="388" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">optional interrupt</text>
<text x="52" y="440" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1c2733">GND  (pin 23)</text>
<text x="868" y="440" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1c2733">GND</text>
<line x1="270" y1="436" x2="650" y2="436" stroke="#2b3a4a" stroke-width="1.8"/>
<text x="460" y="430" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">common ground</text>
<text x="52" y="482" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1c2733">3V3  (pin 36)</text>
<text x="868" y="482" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1c2733">VDD (see board)</text>
<line x1="270" y1="478" x2="650" y2="478" stroke="#2b3a4a" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="460" y="472" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">supply, 3.3 V</text>
<text x="460" y="538" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">All signals are 3.3 V logic. Suggested pins: check the clock-output pin against the RP2040 datasheet.</text>
</svg>
