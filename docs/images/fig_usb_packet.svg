<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360"><title>USB low-speed packet</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a4a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6670"/></marker></defs><rect x="0.75" y="0.75" width="938.5" height="358.5" rx="12" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/>
<rect x="40" y="40" width="110" height="70" rx="3" fill="#fff3c4" stroke="#b38f00" stroke-width="1.3"/>
<text x="95.0" y="73.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1c2733">SYNC</text>
<text x="95.0" y="86.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1c2733">KJKJKJKK</text>
<rect x="150" y="40" width="110" height="70" rx="3" fill="#fde8d0" stroke="#c46a12" stroke-width="1.3"/>
<text x="205.0" y="73.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1c2733">PID</text>
<text x="205.0" y="86.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1c2733">8 bits</text>
<rect x="260" y="40" width="280" height="70" rx="3" fill="#dff3e3" stroke="#2e7d46" stroke-width="1.3"/>
<text x="400.0" y="73.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1c2733">address / data</text>
<text x="400.0" y="86.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1c2733">0 .. 8 bytes</text>
<rect x="540" y="40" width="150" height="70" rx="3" fill="#fbdcdc" stroke="#b32d2d" stroke-width="1.3"/>
<text x="615.0" y="73.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1c2733">CRC</text>
<text x="615.0" y="86.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1c2733">5 or 16 bits</text>
<rect x="690" y="40" width="150" height="70" rx="3" fill="#eef0f3" stroke="#5c6670" stroke-width="1.3"/>
<text x="765.0" y="73.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1c2733">EOP</text>
<text x="765.0" y="86.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1c2733">SE0 SE0 J</text>
<text x="470" y="150" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1c2733">every field is bit-stuffed (a 0 after six 1s) and NRZI coded, except SYNC and EOP</text>
<text x="470" y="174" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#5c6670">1.5 Mbit/s: one bit = 666.7 ns = 33.3 clocks at 50 MHz (26.7 at 40 MHz)</text>
<text x="40" y="226" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#1c2733">SYNC on D+ / D-:</text>
<path d="M190,238 L230,238 L230,268 L270,268 L270,238 L310,238 L310,268 L350,268 L350,238 L390,238 L390,268 L430,268 L430,238 L510,238" stroke="#1f5fbf" stroke-width="2.0" fill="none"/>
<text x="182" y="257.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="bold" fill="#1c2733">D+</text>
