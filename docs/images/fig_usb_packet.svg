<text x="290.0" y="290" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">K</text>
<text x="330.0" y="290" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">J</text>
<text x="370.0" y="290" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">K</text>
<text x="410.0" y="290" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">J</text>
<text x="450.0" y="290" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">K</text>
<text x="490.0" y="290" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">K</text>
<text x="780" y="256" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#5c6670">K: D+ high</text>
<text x="780" y="276" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#5c6670">J: D- high (idle)</text>
</svg>
