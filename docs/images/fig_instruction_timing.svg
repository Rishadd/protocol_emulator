<text x="450" y="190" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1c2733">every instruction takes one clock; the delay of WAIT, OUT1 and IN1 adds d clocks</text>
<text x="450" y="214" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">a pin written at clock 5 is seen by the target after the pin&#x27;s own delay; a pin read is two clocks old (input synchroniser)</text>
<text x="450" y="262" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1c2733">at 50 MHz one clock = 20 ns; at 40 MHz = 25 ns</text>
