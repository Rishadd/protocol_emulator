<text x="179.0" y="110" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" text-anchor="middle" font-weight="bold" fill="#1c2733">SETH p</text>
<text x="179.0" y="126" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#5c6670">1 clock</text>
