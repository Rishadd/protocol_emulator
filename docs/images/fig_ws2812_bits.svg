<text x="450" y="270" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">a latch / reset is a low of more than 50 us; 24 bits per LED (green, red, blue); data is passed on down the strip</text>
