<text x="260" y="209" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1c2733">256 words</text>
<text x="260" y="229" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">(ring)</text>
<line x1="195.32843272420996" y1="241.78784026555633" x2="84.46288882285558" y2="287.7098521493672" stroke="#b32d2d" stroke-width="2.4"/>
<text x="62.28978004258468" y="300.8942545261293" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#b32d2d">trigger</text>
<text x="560" y="70" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1c2733">how to read it</text>
<text x="560" y="100" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1c2733">Blue: words recorded before the trigger (history).</text>
<text x="560" y="121" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1c2733">Orange: words recorded after the trigger.</text>
<text x="560" y="142" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1c2733">The write pointer moves round the ring; when it is full,</text>
<text x="560" y="163" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1c2733">the oldest words are overwritten.</text>
<text x="560" y="184" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1c2733"></text>
<text x="560" y="205" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1c2733">Status gives: write pointer, whether the ring wrapped,</text>
<text x="560" y="226" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1c2733">the trigger word index and the clocks since the</text>
<text x="560" y="247" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1c2733">previous word at the trigger.</text>
<text x="560" y="330" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#1c2733">read the buffer oldest first:</text>
<text x="560" y="352" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#5c6670">if it wrapped, start at the write pointer;</text>
<text x="560" y="371" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#5c6670">if not, start at word 0</text>
</svg>
