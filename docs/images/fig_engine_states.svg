<text x="430.0" y="188.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1c2733">Running</text>
<text x="430.0" y="204.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#5c6670">fetching and executing</text>
<rect x="640" y="40" width="180" height="80" rx="8" fill="#dbe8fb" stroke="#2a5db0" stroke-width="1.5"/>
<text x="730.0" y="78.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1c2733">Halted</text>
<text x="730.0" y="94.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#5c6670">HALT instruction</text>
<rect x="640" y="260" width="180" height="80" rx="8" fill="#fbdcdc" stroke="#b32d2d" stroke-width="1.5"/>
<text x="730.0" y="298.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1c2733">Fault</text>
<text x="730.0" y="314.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#5c6670">stopped, flag set</text>
<line x1="240" y1="175" x2="340" y2="175" stroke="#2b3a4a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="290" y="166" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1c2733">RUN = 1</text>
<line x1="340" y1="205" x2="240" y2="205" stroke="#2b3a4a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="290" y="224" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1c2733">RUN = 0 or HOLD</text>
<line x1="520" y1="165" x2="640" y2="100" stroke="#2b3a4a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="600" y="120" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#1c2733">HALT</text>
<line x1="520" y1="215" x2="640" y2="280" stroke="#2b3a4a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="590" y="262" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1c2733">illegal instruction,</text>
