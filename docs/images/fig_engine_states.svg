<text x="330" y="126" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">RUN = 0 from the host: back to held</text>
<text x="440" y="346" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">RUN = 0 from the host: back to held</text>
<text x="430" y="385" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1c2733">load images and write START only while held</text>
