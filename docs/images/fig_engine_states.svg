<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" width="860" height="410"><title>Engine states</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a4a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6670"/></marker></defs><rect x="0.75" y="0.75" width="858.5" height="408.5" rx="12" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/>
<rect x="60" y="150" width="180" height="80" rx="8" fill="#eef0f3" stroke="#5c6670" stroke-width="1.5"/>
<text x="150.0" y="188.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1c2733">Held</text>
<text x="150.0" y="204.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#5c6670">RUN = 0, window cleared</text>
