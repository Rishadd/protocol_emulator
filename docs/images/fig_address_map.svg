<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 530" width="840" height="530"><title>Address map</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a4a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6670"/></marker></defs><rect x="0.75" y="0.75" width="838.5" height="528.5" rx="12" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/>
<rect x="200" y="30" width="600" height="56" rx="6" fill="#eef0f3" stroke="#5c6670" stroke-width="1.5"/>
<text x="185" y="62.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="bold" fill="#1c2733">0x0000 - 0x0010</text>
<text x="220" y="54.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1c2733">Identity</text>
<text x="220" y="72.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#5c6670">ID, VERSION, CAPABILITY, SCRATCH, ERRCNT</text>
<rect x="200" y="98" width="600" height="56" rx="6" fill="#fff3c4" stroke="#b38f00" stroke-width="1.5"/>
<text x="185" y="130.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="bold" fill="#1c2733">0x0200 - 0x02FF</text>
<text x="220" y="122.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1c2733">Pin window</text>
<text x="220" y="140.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#5c6670">ownership, remap, input select, interrupt, views</text>
<rect x="200" y="166" width="600" height="56" rx="6" fill="#d6f1ef" stroke="#1f7f78" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="185" y="198.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="bold" fill="#1c2733">0x0300 - 0x03FF</text>
<text x="220" y="190.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1c2733">Logic analyser and debug (planned)</text>
<text x="220" y="208.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#5c6670">registers to be defined (Phase 3)</text>
<rect x="200" y="234" width="600" height="70" rx="6" fill="#ece0f7" stroke="#7a3fb0" stroke-width="1.5"/>
<text x="185" y="273.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="bold" fill="#1c2733">0x0400 - 0x0BFC</text>
<text x="220" y="265.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1c2733">Instruction memory</text>
<text x="220" y="283.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#5c6670">word w at 0x0400 + 4 w, w = 0 .. 511</text>
<rect x="200" y="316" width="600" height="78" rx="6" fill="#dbe8fb" stroke="#2a5db0" stroke-width="1.5"/>
<text x="185" y="359.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="bold" fill="#1c2733">0x1000 - 0x1FFF</text>
<text x="220" y="351.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1c2733">Engine 0</text>
<text x="220" y="369.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#5c6670">+0x000 CTRL, +0x008 REGION, +0x00C START, +0x200 TX_DATA, +0x204 RX_DATA</text>
<rect x="200" y="406" width="600" height="56" rx="6" fill="#dbe8fb" stroke="#2a5db0" stroke-width="1.5"/>
<text x="185" y="438.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="bold" fill="#1c2733">0x2000 - 0x2FFF</text>
<text x="220" y="430.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1c2733">Engine 1</text>
<text x="220" y="448.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#5c6670">same layout as engine 0</text>
<text x="500" y="488" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">every address is a 32-bit word register; addresses between blocks are unmapped (result code BAD_ADDR)</text>
</svg>
