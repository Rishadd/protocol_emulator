<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230"><title>Logic analyser workflow</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a4a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6670"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="228.5" rx="12" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/>
<rect x="20" y="60" width="120" height="100" rx="8" fill="#dbe8fb" stroke="#2a5db0" stroke-width="1.5"/>
<text x="80.0" y="86" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1c2733">1 Configure</text>
<text x="80.0" y="110" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">mode, trigger,</text>
<text x="80.0" y="124" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">post-trigger amount</text>
<line x1="140" y1="110" x2="158" y2="110" stroke="#2b3a4a" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="158" y="60" width="120" height="100" rx="8" fill="#dff3e3" stroke="#2e7d46" stroke-width="1.5"/>
<text x="218.0" y="86" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1c2733">2 Arm</text>
<text x="218.0" y="110" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">recording starts</text>
<text x="218.0" y="124" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">into the ring buffer</text>
<line x1="278" y1="110" x2="296" y2="110" stroke="#2b3a4a" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="296" y="60" width="120" height="100" rx="8" fill="#fde8d0" stroke="#c46a12" stroke-width="1.5"/>
<text x="356.0" y="86" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1c2733">3 Trigger</text>
<text x="356.0" y="110" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">the event you chose</text>
<text x="356.0" y="124" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">happens</text>
<line x1="416" y1="110" x2="434" y2="110" stroke="#2b3a4a" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="434" y="60" width="120" height="100" rx="8" fill="#fff3c4" stroke="#b38f00" stroke-width="1.5"/>
<text x="494.0" y="86" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1c2733">4 Post-trigger</text>
<text x="494.0" y="110" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">keeps recording,</text>
<text x="494.0" y="124" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">then freezes</text>
<line x1="554" y1="110" x2="572" y2="110" stroke="#2b3a4a" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="572" y="60" width="120" height="100" rx="8" fill="#ece0f7" stroke="#7a3fb0" stroke-width="1.5"/>
<text x="632.0" y="86" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1c2733">5 Read</text>
<text x="632.0" y="110" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">words and status</text>
<text x="632.0" y="124" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">over the link</text>
<line x1="692" y1="110" x2="710" y2="110" stroke="#2b3a4a" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="710" y="60" width="120" height="100" rx="8" fill="#eef0f3" stroke="#5c6670" stroke-width="1.5"/>
<text x="770.0" y="86" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1c2733">6 Export</text>
<text x="770.0" y="110" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">VCD file</text>
<text x="770.0" y="124" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">(la_capture.py)</text>
<line x1="830" y1="110" x2="848" y2="110" stroke="#2b3a4a" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="848" y="60" width="120" height="100" rx="8" fill="#d6f1ef" stroke="#1f7f78" stroke-width="1.5"/>
<text x="908.0" y="86" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1c2733">7 View</text>
<text x="908.0" y="110" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5c6670">GTKWave</text>
<text x="500" y="30" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#5c6670">the chip does steps 2 to 4 on its own; the host only configures, waits and reads</text>
<text x="500" y="200" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">the interrupt output (or polling the state) tells the host that step 4 has finished</text>
</svg>
