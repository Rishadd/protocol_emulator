<text x="470" y="452" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">RGET and RPUT move values between the registers and the shifters, counters, CRC and FIFOs</text>
