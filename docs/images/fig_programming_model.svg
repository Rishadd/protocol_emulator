<text x="395.0" y="116.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">8 x 32 bit, flags Z N C</text>
<rect x="480" y="70" width="140" height="64" rx="8" fill="#dbe8fb" stroke="#2a5db0" stroke-width="1.5"/>
<text x="550.0" y="100.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1c2733">ALU</text>
<text x="550.0" y="116.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">13 functions</text>
<rect x="320" y="156" width="150" height="56" rx="8" fill="#fde8d0" stroke="#c46a12" stroke-width="1.5"/>
<text x="395.0" y="182.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1c2733">OSR</text>
<text x="395.0" y="198.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">output shifter</text>
<rect x="480" y="156" width="140" height="56" rx="8" fill="#fde8d0" stroke="#c46a12" stroke-width="1.5"/>
<text x="550.0" y="182.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1c2733">ISR</text>
<text x="550.0" y="198.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">input shifter</text>
<rect x="320" y="250" width="300" height="56" rx="8" fill="#fff3c4" stroke="#b38f00" stroke-width="1.5"/>
<text x="470.0" y="276.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1c2733">Pin block</text>
<text x="470.0" y="292.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">8 logical pins: output, enable, input</text>
<rect x="320" y="334" width="94" height="76" rx="8" fill="#dbe8fb" stroke="#2a5db0" stroke-width="1.5"/>
