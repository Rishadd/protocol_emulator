<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470"><title>Engine programming model</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a4a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6670"/></marker></defs><rect x="0.75" y="0.75" width="938.5" height="468.5" rx="12" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/>
<rect x="300" y="30" width="340" height="400" rx="10" fill="#eef0f3" stroke="#5c6670" stroke-width="1.5"/>
<text x="470" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1c2733">one engine</text>
<rect x="320" y="70" width="150" height="64" rx="8" fill="#dbe8fb" stroke="#2a5db0" stroke-width="1.5"/>
