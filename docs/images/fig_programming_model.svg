<text x="280" y="176" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1c2733">PULL</text>
<line x1="620" y1="184" x2="700" y2="184" stroke="#2b3a4a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="660" y="176" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1c2733">PUSH</text>
<rect x="700" y="250" width="200" height="70" rx="8" fill="#fff3c4" stroke="#b38f00" stroke-width="1.5"/>
<text x="800.0" y="283.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1c2733">Pins</text>
<text x="800.0" y="299.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">to the pin manager</text>
<line x1="620" y1="278" x2="700" y2="278" stroke="#2b3a4a" stroke-width="1.6" marker-end="url(#ah)" marker-start="url(#ah)"/>
<rect x="40" y="334" width="200" height="76" rx="8" fill="#ece0f7" stroke="#7a3fb0" stroke-width="1.5"/>
<text x="140.0" y="370.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1c2733">Program memory</text>
<text x="140.0" y="386.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">one word per clock</text>
