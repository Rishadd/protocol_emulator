<text x="367.0" y="390.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#5c6670">DJNZ</text>
<rect x="423" y="334" width="94" height="76" rx="8" fill="#dbe8fb" stroke="#2a5db0" stroke-width="1.5"/>
<text x="470.0" y="370.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#1c2733">CRC unit</text>
<text x="470.0" y="386.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#5c6670">1 to 32 bit</text>
