<text x="140.0" y="183.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1c2733">TX FIFO (4 words)</text>
<text x="140.0" y="199.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5c6670">written by the host</text>
